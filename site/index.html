<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>HR Mate demo</title>
    <style>
      :root { --bg: #f8f6f2; --fg: #0f0920; --muted: #5f5873; --line: #ddd8cf; --link: #b8322a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f0920; --fg: #f3efe8; --muted: #a9a2bc; --line: #322a47; --link: #ff958c; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; display: flex; flex-direction: column; gap: 1.5rem; }
      h1 { margin: 0; font-size: 1.75rem; }
      p { margin: 0; color: var(--muted); }
      ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
      li { padding: 1rem 0; border-bottom: 1px solid var(--line); }
      a { color: var(--link); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>HR Mate demo</h1>
      <p>Clickable previews on fictional data. Nothing here calls a model or a real HR system.</p>
      <ul>
        <li>
          <a href="prototype/">Admin panel prototype</a>
          <p>The redesigned HR Mate admin panel and Google Chat bot cards, from first-run setup to an established workspace.</p>
        </li>
      </ul>
    </main>
  </body>
</html>
