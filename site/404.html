<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>HR Mate demo</title>
    <script>
      // GitHub Pages serves this file for any unknown path. A deep link into an app (/<repo>/<app>/some/route) goes to
      // the app's index.html as /<repo>/<app>/?/some/route; the app's own index.html restores the real path
      // (spa-github-pages). Anything else goes to the site's start page.
      (function (l) {
        var apps = ['prototype']
        var seg = l.pathname.split('/')
        var root = '/' + seg[1] + '/'
        if (apps.indexOf(seg[2]) === -1) return l.replace(root)
        var rest = seg.slice(3).join('/')
        var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : ''
        l.replace(root + seg[2] + '/?/' + rest.replace(/&/g, '~and~') + query + l.hash)
      })(window.location)
    </script>
  </head>
</html>
