# Builds the apps and publishes them to GitHub Pages:
#   https://zazmicinc.github.io/hrmate-demo/             start page
#   https://zazmicinc.github.io/hrmate-demo/prototype/   the admin panel prototype
#
# Optional password screen: add a repository secret DEMO_PASSWORD and re-run this workflow. Only its SHA-256 goes into
# the build. It keeps casual visitors out; it is not access control (the published site is reachable by anyone with the link).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Build the prototype
        env:
          BASE_PATH: /${{ github.event.repository.name }}/prototype/
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -n "$DEMO_PASSWORD" ]; then
            export VITE_DEMO_GATE="$(printf '%s' "$DEMO_PASSWORD" | sha256sum | cut -d' ' -f1)"
          fi
          pnpm --filter hrmate-prototype build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html site/404.html _site/
          cp -r apps/prototype/dist _site/prototype
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}prototype/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
